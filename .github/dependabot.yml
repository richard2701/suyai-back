version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Strapi packages must move together: mixed versions break the admin build.
      strapi:
        patterns:
          - "@strapi/*"
          - "strapi"
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@strapi/*"
          - "strapi"
    ignore:
      # Major Strapi upgrades are planned manually (see the core upgrade PR #64).
      - dependency-name: "@strapi/*"
        update-types: ["version-update:semver-major"]
      # graphql 17 breaks Strapi boot: @strapi/plugin-graphql requires graphql ^16.8.1 (see #87).
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 removes moduleResolution=node10 (the tsconfig fails) and Strapi 5 tooling
      # is built against TypeScript 5.x; revisit when Strapi documents TS 7 support (see #103).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
