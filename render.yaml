services:
  - type: web
    name: strapi
    env: node
    plan: starter
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    healthCheckPath: /_health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: strapi
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_EMAIL_ADMIN
        sync: false
      # Comma-separated exact SPA origins, e.g. https://example.com,https://www.example.com
      - key: FRONTEND_URL
        sync: false
      # Header holding the real client IP (defaults to cf-connecting-ip, see src/index.ts).
      - key: PROXY_IP_HEADER
        sync: false
      # Public form limit per IP (defaults: 5 per 10 minutes).
      - key: FORM_RATE_LIMIT_MAX
        sync: false
      - key: FORM_RATE_LIMIT_WINDOW_MINUTES
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false
      - key: RECAPTCHA_API_KEY
        sync: false
      - key: RECAPTCHA_PROJECT_ID
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

databases:
  - name: strapi
    plan: basic-256mb
    diskSizeGB: 1
