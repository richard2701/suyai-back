# Documents the LIVE Render configuration (verified through the Render API on 2026-11-03).
# The service was created in the dashboard and is not managed as a Blueprint, so editing this
# file does not change Render: update the dashboard too, and keep both in sync.
services:
  - type: web
    name: suyai-app
    runtime: node
    region: oregon
    # Free instances spin down after 15 minutes without traffic and take about a minute to
    # wake up. 750 free instance hours per workspace per month cover one always-on service.
    plan: free
    repo: https://github.com/richard2701/suyai-back
    branch: main
    # Every commit to main deploys automatically.
    autoDeploy: true
    buildCommand: yarn install; yarn build
    startCommand: yarn run start
    # Not configured in Render today. Recommended: healthCheckPath /_health (returns 204).
    #
    # Recommended build command (not applied yet): fails on lockfile drift and skips the unused
    # better-sqlite3 native build, rebuilding sharp for @strapi/upload image processing:
    #   yarn install --frozen-lockfile --ignore-scripts && npm rebuild sharp && yarn build
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      # config/database.ts defaults to sqlite; better-sqlite3 is not built (--ignore-scripts).
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: suyai-bd
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_EMAIL_ADMIN
        sync: false
      # Comma-separated exact SPA origins, e.g. https://example.com,https://www.example.com
      - key: FRONTEND_URL
        sync: false
      # Header holding the real client IP (defaults to cf-connecting-ip, see src/index.ts).
      - key: PROXY_IP_HEADER
        sync: false
      # Public form limit per IP (defaults: 5 per 10 minutes).
      - key: FORM_RATE_LIMIT_MAX
        sync: false
      - key: FORM_RATE_LIMIT_WINDOW_MINUTES
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false
      - key: RECAPTCHA_API_KEY
        sync: false
      - key: RECAPTCHA_PROJECT_ID
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

databases:
  - name: suyai-bd
    databaseName: suyai_bd
    user: suyai_bd_user
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
